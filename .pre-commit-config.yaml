repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: lint
        name: ESLint
        entry: pnpm run lint
        language: system
        pass_filenames: false
      - id: test
        name: Vitest
        entry: pnpm test
        language: system
        pass_filenames: false
      - id: build
        name: TypeScript & Vite Build
        entry: pnpm run build
        language: system
        pass_filenames: false
